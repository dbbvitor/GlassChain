# glasschain-demo — browser demonstration package (root workspace
# `exclude = ["demo"]`; see `.agents/plans/gui-demo-benchmark.md`).
[package]
name = "glasschain-demo"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Standalone: not a workspace member, but the crate sources stay path-linked.
[dependencies]
glasschain-core = { path = "../crates/glasschain-core" }
glasschain-identity = { path = "../crates/glasschain-identity" }
glasschain-indexer = { path = "../crates/glasschain-indexer" }
glasschain-network = { path = "../crates/glasschain-network" }

axum = "0.8"
async-stream = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"

[lints.rust]
unsafe_code = "deny"
