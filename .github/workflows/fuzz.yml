name: Fuzz

# Dynamic analysis (Gold `dynamically_analysis`): two libFuzzer harnesses over
# the untrusted decode surfaces — `fuzz-wire` (network `Message` JSON) and
# `fuzz-transactions` (core `Transaction` JSON). PRs and pushes get a short
# smoke run; the weekly scheduled run digs deeper (wayfinder #166
# re-evaluation). OSS-Fuzz integration is intentionally out of scope
# pre-release.

on:
  schedule:
    - cron: "0 4 * * 1" # Weekly, Monday 04:00 UTC
  push:
    branches: [main]
    paths:
      - "crates/glasschain-core/**"
      - "crates/glasschain-network/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/glasschain-core/**"
      - "crates/glasschain-network/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust nightly (required by cargo-fuzz/libFuzzer)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          # Dated, not `nightly`: a moving toolchain invalidates the
          # rust-cache every night (wayfinder #167).
          toolchain: nightly-2026-09-20
          components: rust-src
          # std for the explicit --target triple used by the fuzz runs below.
          targets: x86_64-unknown-linux-gnu

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-fuzz

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-on-failure: true

      # libFuzzer coverage instrumentation without an address sanitizer:
      # the sanitizer would fight ring/libp2p C code; panic/overflow crash
      # detection is what this decode surface needs. RUSTUP_TOOLCHAIN pins
      # nightly over the repo's rust-toolchain.toml (1.98.1), which
      # cargo-fuzz's nightly-only flags cannot run under. --target is pinned
      # to the runner-native gnu triple because cargo-fuzz's *default* target
      # is the triple its prebuilt binary was built for (musl in
      # taiki-e/install-action), which would need a musl C/C++ toolchain that
      # Ubuntu does not provide (no musl-g++ for libFuzzer's C++ runtime).
      - name: Smoke fuzz on PRs, deep fuzz on schedule
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-20
        run: |
          secs=60
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            secs=300
          fi
          (cd crates/glasschain-network && cargo fuzz run -s none --target x86_64-unknown-linux-gnu fuzz-wire -- -max_total_time=$secs)
          (cd crates/glasschain-core && cargo fuzz run -s none --target x86_64-unknown-linux-gnu fuzz-transactions -- -max_total_time=$secs)
