name: Benchmarks

# Criterion benches run here, parallel to the gates in ci.yml. The test job
# excludes bench *executions* (their test-mode setup dominates runtime and
# yields no test coverage), so this workflow is where they run for real:
# release builds, full criterion measurement.
#
# Weekly rather than per-PR (wayfinder #158/#167): a benchmark run contributes
# no gate, and on PRs it only burned runner time.
on:
  schedule:
    - cron: "0 6 * * 1" # Weekly, Monday 06:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Criterion benches
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-on-failure: true

      # -p keeps the build to the bench crates and their dependencies, so
      # protoc (needed only by glasschain-rpc) is not required here.
      - name: Run benches
        run: |
          cargo bench -p glasschain-core
          cargo bench -p glasschain-vm
          cargo bench -p glasschain-workflows
