name: CI

on:
  push:
    branches: [main]
    # Every job here is a code check (format, lint, test, coverage): skip the
    # whole workflow when only documentation changes. .github/** is included
    # so CI config changes always self-validate. The dependency audit is a
    # separate workflow (.github/workflows/audit.yml) so it carries its own
    # status badge.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".cargo/**"
      - "scripts/**"
      - "Makefile"
      - "codecov.yml"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".cargo/**"
      - "scripts/**"
      - "Makefile"
      - "codecov.yml"
      - ".github/**"
  # Nightly full-workspace sweep (wayfinder #166 re-evaluation): PRs run the
  # diff-scoped variants of these jobs, so the whole workspace is re-verified
  # every night even when no merge has landed.
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PR diff's affected packages: changed crates plus every crate that
  # depends on them (reverse-dependency closure), so package-scoped checks
  # never miss a dependent. `ALL` (workspace-level file or non-PR event) runs
  # the full workspace; `NONE` (no crate touched) skips the package jobs.
  # Pushes to main run full — main is verified end to end after merge.
  changes:
    name: Affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
      cargo_flags: ${{ steps.affected.outputs.cargo_flags }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The diff needs the merge base with the target branch.
          fetch-depth: 0

      - name: Compute affected packages
        id: affected
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="HEAD~1"
          fi
          packages=$(scripts/affected-crates.sh "$base")
          flags=$(scripts/affected-crates.sh "$base" --cargo-flags)
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            packages=ALL
            flags=--workspace
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "cargo_flags=$flags" >> "$GITHUB_OUTPUT"
          echo "affected: $packages"

  # DCO (Silver `1.dco`): every PR commit must carry a `Signed-off-by` line
  # matching its author. Contributors run `git commit -s`; a missing sign-off
  # is fixed with `git commit --amend -s`. Bot-authored commits (Dependabot,
  # GitHub Actions, ...) are exempt: a bot cannot assert the DCO, and the
  # maintainer who merges the PR takes responsibility for it.
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify sign-offs on every commit
        run: |
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          fail=0
          while IFS= read -r sha; do
            name=$(git log -1 --format='%an' "$sha")
            email=$(git log -1 --format='%ae' "$sha")
            # Bot-authored commits cannot assert the DCO themselves.
            if [[ "$name" == *"[bot]"* || "$email" == *"[bot]"* ]]; then
              echo "Skipping bot-authored commit $sha ($name <$email>)."
              continue
            fi
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qF "$email"; then
              echo "Commit $sha ($name <$email>) lacks a matching 'Signed-off-by' line."
              echo "  Fix with: git commit --amend -s"
              fail=1
            fi
          done < <(git log --format='%H' "$range")
          exit "$fail"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust with rustfmt
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.packages != 'NONE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust with clippy
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-on-failure: true

      # Scoped to the affected packages (the diff plus their dependents).
      - name: Run clippy
        run: >-
          cargo clippy ${{ needs.changes.outputs.cargo_flags }}
          --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: [changes, fmt]
    if: needs.changes.outputs.packages != 'NONE' 
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-on-failure: true

      # cargo test compiles every target it runs and clippy (parallel job)
      # already lints all targets, so a separate cargo check step would only
      # duplicate work. `--lib --bins --tests` runs every unit and integration
      # test; criterion bench *executions* are excluded on purpose — their
      # test-mode setup mines a 10k-block history in debug and dominated the
      # job (~20+ min per OS). Benches stay compile-checked via clippy
      # --all-targets and run for real through `make bench` / `cargo bench`.
      # cargo-nextest runs each test in its own process (the shared port-band
      # allocator is per-process, so no collisions) and emits JUnit XML for
      # Codecov test analytics via the `ci` profile (.config/nextest.toml).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-nextest

      # wild/mold are ELF linkers: Linux only, and the selector is a no-op on
      # the macOS/Windows legs (AGENTS.md / ADR-019 linker policy).
      - name: Install wild (preferred linker)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: wild

      - name: Select the preferred linker
        run: scripts/prefer-fast-linker.sh

      - name: Run all tests
        run: >-
          cargo nextest run --profile ci ${{ needs.changes.outputs.cargo_flags }}
          --lib --bins --tests --all-features --locked

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml

  # Full workspace on purpose: the Codecov project gate needs the complete
  # report; patch coverage is Codecov's own diff-scoped status.
  coverage:
    name: Code coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-on-failure: true

      - name: Install cargo-llvm-cov, cargo-nextest and wild
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,wild

      - name: Select the preferred linker
        run: scripts/prefer-fast-linker.sh

      - name: Generate coverage report
        # cargo-llvm-cov with nextest: the same runner and flags as the test
        # job, so a passing test matrix implies a complete report. Benches are
        # excluded like the test job (their setup dominates the run and yields
        # no library coverage). Verified locally before the flip: 94.18% line
        # coverage (19 523 / 20 729 lines) against the pinned 90% gate; see
        # ADR-019.
        run: >-
          cargo llvm-cov nextest --profile ci --workspace --lib --bins --tests
          --all-features --locked --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          # The flag defined in codecov.yml; one report → one flag.
          flags: llvm-cov
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}

  # The curated Kani harnesses run on every PR and push (ADR-019): the pure
  # predicate surface of glasschain-core and the zero-trust byte surfaces of
  # glasschain-identity. Measured warm at 2m40s and well inside the
  # 30-minute guardrail, so the weekly deep-checks Kani job was retired with
  # this move. Autoharness is deliberately not a step here: kani-verifier
  # 0.68.0 kills goto-instrument on this workspace, so it stays a local,
  # advisory tool until the recorded revisit trigger (see
  # .agents/memories/kani-deferral.md).
  kani:
    name: Kani proofs
    needs: changes
    if: >-
      needs.changes.outputs.packages == 'ALL' ||
      contains(needs.changes.outputs.packages, 'glasschain-core') ||
      contains(needs.changes.outputs.packages, 'glasschain-identity')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: kani
          shared-key: rust-cache
          cache-on-failure: true

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier@0.68.0
          cargo kani setup

      # --sarif feeds GitHub code scanning; concrete playback prints a
      # runnable reproducer into the job log when a harness fails.
      - name: Verify the curated harnesses
        run: >-
          cargo kani -p glasschain-core -p glasschain-identity --default-unwind 16
          --output-format=terse --sarif kani.sarif
          -Z concrete-playback --concrete-playback=print

      - name: Upload the SARIF report
        if: always() && hashFiles('kani.sarif') != ''
        # Forks and private repos may not have code scanning enabled; the
        # SARIF upload must never mask a failing (or passing) proof gate.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: kani.sarif

  # Verus proves the zero-trust decision logic (ADR-019): the vm gas module
  # and the BFT quorum/bitmap arithmetic. A warm run is seconds and a cold
  # one is minutes, so it runs on every PR and push like the Kani job; the
  # weekly deep-checks Verus job was retired with this move.
  verus:
    name: Verus proofs
    needs: changes
    if: >-
      needs.changes.outputs.packages == 'ALL' ||
      contains(needs.changes.outputs.packages, 'glasschain-core') ||
      contains(needs.changes.outputs.packages, 'glasschain-identity') ||
      contains(needs.changes.outputs.packages, 'glasschain-vm')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Verus LLM guide's cheat checker: `assume`/`admit`/`external_body`/
      # `axiom` would make a proof pass vacuously. `kani::assume` is Kani's
      # harness constraint, not a Verus proof shortcut, so the pattern only
      # matches bare `assume(`.
      - name: Check for proof cheats
        run: |
          if grep -rnE '(^|[^:a-zA-Z0-9_])(assume|admit)\(|external_body|#\[axiom|verus::.*axiom' \
              crates --include='*.rs'; then
            echo "::error::Verus cheat marker found in the sources"
            exit 1
          fi

      # The stable release, not `release/rolling`: rolling tags are deleted
      # when the next one appears (the 2026-09-24 asset 404'd within a day),
      # so they cannot be SHA-pinned. 0.2026.09.20.aef82ed is the newest
      # immutable release and verifies the same proof set (43 + 2 + 9).
      - name: Install Verus
        run: |
          curl -sSLfo verus.zip \
            https://github.com/verus-lang/verus/releases/download/release%2F0.2026.09.20.aef82ed/verus-0.2026.09.20.aef82ed-x86-linux.zip
          echo "7b870fa12bc589015c2fab60a8b3d9f07c7b1adb3444eb0fadffcbf7f0447b33  verus.zip" | sha256sum -c -
          unzip -q verus.zip
          echo "$PWD/verus-x86-linux" >> "$GITHUB_PATH"

      # The zero-trust modules (#170): gas, BFT quorum/bitmap + certificate
      # admission, TOFU pin, trust score, MSP height windows, the #176
      # consensus-round kernels, channel membership and the private-payload
      # gate. More crates join as their annotations land.
      - name: Verify the production proofs
        run: >-
          cargo verus verify -p glasschain-vm -p glasschain-core -p glasschain-identity
          --all-features --locked

  # Miri runs on every PR and push (ADR-019): six crates, strict flags, leaks
  # are failures. Measured locally, the long pole is glasschain-core at ~19
  # minutes; the other five legs finish under two. The matrix wall-clock stays
  # inside the 30-minute guardrail, so the nightly deep-checks Miri matrix was
  # retired.
  miri:
    name: Miri (${{ matrix.crate }})
    needs: changes
    # The six-crate allowlist runs when the diff (plus dependents) touches any
    # of it; a leaf crate outside the list skips the matrix entirely.
    if: >-
      needs.changes.outputs.packages == 'ALL' ||
      contains(needs.changes.outputs.packages, 'glasschain-core') ||
      contains(needs.changes.outputs.packages, 'glasschain-contracts') ||
      contains(needs.changes.outputs.packages, 'glasschain-indexer') ||
      contains(needs.changes.outputs.packages, 'glasschain-workflows') ||
      contains(needs.changes.outputs.packages, 'glasschain-storage') ||
      contains(needs.changes.outputs.packages, 'glasschain-sdk')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        crate:
          - glasschain-core
          - glasschain-contracts
          - glasschain-indexer
          - glasschain-workflows
          - glasschain-storage
          - glasschain-sdk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly Rust with miri
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          # Dated, not `nightly`: a moving toolchain invalidates the
          # rust-cache every run (wayfinder #167).
          toolchain: nightly-2026-09-20
          components: miri

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: miri-${{ matrix.crate }}
          shared-key: rust-cache
          cache-on-failure: true

      # Strict flags (wayfinder #153), no `-Zmiri-ignore-leaks`: the `Cow`
      # schema-hash fix removed the only known leak. Default features only;
      # FFI crates (blst, wasmtime, ring) cannot run under Miri.
      - name: Run Miri
        env:
          MIRIFLAGS: >-
            -Zmiri-disable-isolation
            -Zmiri-strict-provenance
            -Zmiri-symbolic-alignment-check
        run: |
          cargo +nightly-2026-09-20 miri test -p ${{ matrix.crate }} --lib -- \
            --skip wasm \
            --skip test_pending_pool_bound_rejects_and_drains \
            --skip test_slice_quota_spreads_a_burst_across_rounds \
            --skip ledger_default_uses_the_workspace_difficulty \
            --skip test_d3_index_semantics_match_full_rebuild_after_history_growth

  # ASan/LSan runs on every PR and push (ADR-019), diff-scoped like the other
  # build jobs: the affected crates' tests under `-Zbuild-std`, zero
  # suppressions — leaks are failures (wayfinder #163). The std rebuild is a
  # fixed cost, so scoping still cuts the per-crate test builds. Measured on a
  # GitHub runner at 5m22s for the full workspace (the 50-minute figure that
  # kept it scheduled was a cold local 4-core box); the nightly `ci.yml` sweep
  # and pushes run it whole-workspace. A deliberate-leak canary proves LSan is
  # armed before the suite runs.
  asan:
    name: ASan/LSan
    needs: changes
    if: needs.changes.outputs.packages != 'NONE'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          # Dated, not `nightly`: a moving toolchain invalidates the
          # rust-cache every run (wayfinder #167).
          toolchain: nightly-2026-09-20
          components: rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: asan
          shared-key: rust-cache
          cache-on-failure: true

      - name: Install wild (preferred linker)
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: wild

      # The selector reads this step's RUSTFLAGS and writes the combined value
      # (sanitizer + wild/mold) for the run step (AGENTS.md / ADR-019).
      - name: Select the preferred linker with ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: scripts/prefer-fast-linker.sh

      # Prove leak detection is actually armed before trusting a clean suite:
      # a deliberately leaked allocation must fail this canary. LSan silently
      # no-ops where its ptrace-based tracer cannot start, which would turn
      # "zero suppressions" into zero coverage.
      - name: Canary — LSan catches a deliberate leak
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
        run: |
          mkdir -p "$RUNNER_TEMP/lsan-canary/src"
          cat > "$RUNNER_TEMP/lsan-canary/Cargo.toml" <<'EOF'
          [package]
          name = "lsan-canary"
          version = "0.0.0"
          edition = "2021"
          EOF
          cat > "$RUNNER_TEMP/lsan-canary/src/main.rs" <<'EOF'
          fn main() {
              std::mem::forget(Box::new(42u8));
          }
          EOF
          cd "$RUNNER_TEMP/lsan-canary"
          log="$RUNNER_TEMP/lsan-canary.log"
          if cargo +nightly-2026-09-20 run --quiet >"$log" 2>&1; then
            echo "::error::LSan did not fail a deliberate leak — leak detection is not armed"
            exit 1
          fi
          if ! grep -Eq "LeakSanitizer|leaked in" "$log"; then
            echo "::error::expected a LeakSanitizer report"
            cat "$log"
            exit 1
          fi
          echo "LSan canary passed: the deliberate leak was caught."

      - name: Run the suite under ASan/LSan
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: >-
          cargo +nightly-2026-09-20 test ${{ needs.changes.outputs.cargo_flags }}
          --lib --bins --tests --all-features --locked
          -Zbuild-std --target x86_64-unknown-linux-gnu

  # The deterministic partition/repair scenario runs on every PR and push:
  # measured at ~0.2 s of test time (21 s including the build), so the weekly
  # deep-checks leg was retired.
  turmoil:
    name: Turmoil chaos
    needs: changes
    if: >-
      needs.changes.outputs.packages == 'ALL' ||
      contains(needs.changes.outputs.packages, 'glasschain-network')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: turmoil
          shared-key: rust-cache
          cache-on-failure: true

      - name: Run the deterministic chaos scenario
        run: cargo test -p glasschain-network --test turmoil_chaos --features turmoil-sim --locked

  # The ignored capacity/measurement gates run on every PR and push: measured
  # at ~5 minutes of test time serially. The 200- and 300-validator BFT
  # finality gates are manual-only: their ~80k/~180k-socket meshes exceed the
  # 65535-fd hard limit of a GitHub-hosted runner (and the 300-validator mesh
  # does not diffuse on 4 cores either). Serial so concurrent meshes do not
  # distort the measurements or starve each other's diffusion.
  gates:
    name: Ignored gates
    needs: changes
    if: >-
      needs.changes.outputs.packages == 'ALL' ||
      contains(needs.changes.outputs.packages, 'glasschain-network') ||
      contains(needs.changes.outputs.packages, 'glasschain-indexer')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: gates
          shared-key: rust-cache
          cache-on-failure: true

      - name: Capacity and finality gates
        run: |
          ulimit -n 65535
          cargo test -p glasschain-network --test consensus_capacity --all-features --locked -- \
            --ignored --nocapture --test-threads=1 \
            --skip bft_finality_gate_200_validators \
            --skip bft_finality_gate_300_validators

      - name: TCP partition gates
        run: |
          ulimit -n 65535
          cargo test -p glasschain-network --test tcp_partition --all-features --locked -- \
            --ignored --nocapture --test-threads=1

      - name: Read-path memory gates
        run: |
          ulimit -n 65535
          cargo test -p glasschain-indexer --test read_path_memory --all-features --locked -- \
            --ignored --nocapture --test-threads=1

      - name: Verification cost measurement
        run: |
          ulimit -n 65535
          cargo test -p glasschain-network --lib --all-features --locked -- \
            --ignored --nocapture --test-threads=1
