name: CI

on:
  push:
    branches: [main]
    # Every job here is a code check (format, lint, test, coverage): skip the
    # whole workflow when only documentation changes. .github/** is included
    # so CI config changes always self-validate. The dependency audit is a
    # separate workflow (.github/workflows/audit.yml) so it carries its own
    # status badge.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".cargo/**"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".cargo/**"
      - ".github/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust with rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust with clippy
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: [fmt]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-on-failure: true

      # cargo test compiles every target it runs and clippy (parallel job)
      # already lints all targets, so a separate cargo check step would only
      # duplicate work. `--lib --bins --tests` runs every unit and integration
      # test; criterion bench *executions* are excluded on purpose — their
      # test-mode setup mines a 10k-block history in debug and dominated the
      # job (~20+ min per OS). Benches stay compile-checked via clippy
      # --all-targets and run for real through `make bench` / `cargo bench`.
      - name: Run all tests
        run: cargo test --workspace --lib --bins --tests --all-features --locked

  coverage:
    name: Code coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-on-failure: true

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage report
        # --engine llvm: wasmtime delivers WASM traps (e.g. `unreachable`, fuel
        # exhaustion) via SIGILL/SIGSEGV caught by its own signal handler; the
        # default ptrace engine intercepts those signals and aborts the run.
        # --lib --bins --tests: same surface as the test job — benches are
        # excluded (their test-mode setup dominates the run and yields no
        # library coverage). Tests bind ports through the shared per-process
        # allocator (glasschain-network/tests/common/ports.rs), so the
        # parallel libtest harness cannot collide on loopback ports even
        # under tarpaulin's instrumented execution (the bind→drop→rebind
        # window that forced RUST_TEST_THREADS=1 here, sncm_compliance
        # 2026-09-03, is gone).
        run: cargo tarpaulin --verbose --workspace --all-features --lib --bins --tests --locked --timeout 120 --engine llvm --out xml

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}
