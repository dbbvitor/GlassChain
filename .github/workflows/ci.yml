name: CI

on:
  push:
    branches: [main]
    # Every job here is a code check (format, lint, test, coverage): skip the
    # whole workflow when only documentation changes. .github/** is included
    # so CI config changes always self-validate. The dependency audit is a
    # separate workflow (.github/workflows/audit.yml) so it carries its own
    # status badge.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".cargo/**"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".cargo/**"
      - ".github/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DCO (Silver `1.dco`): every PR commit must carry a `Signed-off-by` line
  # matching its author. Contributors run `git commit -s`; a missing sign-off
  # is fixed with `git commit --amend -s`.
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify sign-offs on every commit
        run: |
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          fail=0
          while IFS= read -r sha; do
            name=$(git log -1 --format='%an' "$sha")
            email=$(git log -1 --format='%ae' "$sha")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qF "$email"; then
              echo "Commit $sha ($name <$email>) lacks a matching 'Signed-off-by' line."
              echo "  Fix with: git commit --amend -s"
              fail=1
            fi
          done < <(git log --format='%H' "$range")
          exit "$fail"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust with rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust with clippy
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: [fmt]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-on-failure: true

      # cargo test compiles every target it runs and clippy (parallel job)
      # already lints all targets, so a separate cargo check step would only
      # duplicate work. `--lib --bins --tests` runs every unit and integration
      # test; criterion bench *executions* are excluded on purpose — their
      # test-mode setup mines a 10k-block history in debug and dominated the
      # job (~20+ min per OS). Benches stay compile-checked via clippy
      # --all-targets and run for real through `make bench` / `cargo bench`.
      # cargo-nextest runs each test in its own process (the shared port-band
      # allocator is per-process, so no collisions) and emits JUnit XML for
      # Codecov test analytics via the `ci` profile (.config/nextest.toml).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run all tests
        run: cargo nextest run --profile ci --workspace --lib --bins --tests --all-features --locked

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml

  coverage:
    name: Code coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-on-failure: true

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage report
        # --engine llvm: wasmtime delivers WASM traps (e.g. `unreachable`, fuel
        # exhaustion) via SIGILL/SIGSEGV caught by its own signal handler; the
        # default ptrace engine intercepts those signals and aborts the run.
        # --lib --bins --tests: same surface as the test job — benches are
        # excluded (their test-mode setup dominates the run and yields no
        # library coverage). Tests bind ports through the shared per-process
        # allocator (glasschain-network/tests/common/ports.rs), so the
        # parallel libtest harness cannot collide on loopback ports even
        # under tarpaulin's instrumented execution (the bind→drop→rebind
        # window that forced RUST_TEST_THREADS=1 here, sncm_compliance
        # 2026-09-03, is gone).
        run: cargo tarpaulin --verbose --workspace --all-features --lib --bins --tests --locked --timeout 120 --engine llvm --out xml

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}
