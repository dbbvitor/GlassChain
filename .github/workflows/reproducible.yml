name: Reproducible build

# Reproducible-builds.org verification (Gold `build_reproducible`), scoped
# honestly: Linux x86_64 only. Cross-runner (macOS/Windows) determinism is
# not claimed; the compliance plan documents this limitation.
#
# The build command and SOURCE_DATE_EPOCH must match release.yml, otherwise
# this proves reproducibility of a build the release never performs
# (wayfinder #158/#167).

on:
  schedule:
    - cron: "0 5 * * 1" # Weekly, Monday 05:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: "946684800" # 2000-01-01T00:00:00Z

permissions:
  contents: read

jobs:
  verify:
    name: Build twice, compare hashes
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1

      - name: Install cargo-auditable
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-auditable

      # The isolated build dirs are what is cached; the default `target` dir
      # is never written here.
      - name: Cache build directories
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ github.job }}
          shared-key: rust-cache
          cache-targets: false
          cache-directories: |-
            target-a
            target-b
          cache-on-failure: true

      - name: Build twice in isolated target dirs
        run: |
          CARGO_TARGET_DIR=target-a cargo auditable build --release --locked
          CARGO_TARGET_DIR=target-b cargo auditable build --release --locked

      - name: Compare artifact hashes
        run: |
          (cd target-a/release && find . -maxdepth 1 -type f | sort | xargs sha256sum) > /tmp/hashes-a
          (cd target-b/release && find . -maxdepth 1 -type f | sort | xargs sha256sum) > /tmp/hashes-b
          if ! diff -u /tmp/hashes-a /tmp/hashes-b; then
            echo "::error::Release artifacts are not bit-for-bit reproducible; see the hash diff above."
            exit 1
          fi
          echo "All release artifacts reproduced bit-for-bit."
