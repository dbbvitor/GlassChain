# cargo-mutants configuration (wayfinder tickets #146/#156, part of #139).
#
# `--all-features` is mandatory: without it, cfg-gated `bft.rs` mutants are
# compiled out and report as false misses (117 of 142 in the #146 baseline).
additional_cargo_test_args = ["--all-features"]
#
# The per-mutant cap (`--timeout 60`) is a CLI-only option: the config file
# rejects unknown fields, so it cannot live here. Every invocation that needs
# the cap passes it explicitly (`make mutants`, `make mutants-diff`,
# analysis.yml's diff job, and the deep-checks shards).
# Build with the stripped `mutants` profile (Cargo.toml).
profile = "mutants"

# Kani writes `cargo kani`-only code: cargo-mutants does not treat
# `cfg(kani)` as a test-only gate, so it would mutate the harness bodies,
# which the ordinary test suite never runs. The harnesses are exercised by
# Kani itself in the weekly deep-checks job (wayfinder #166/#157).
exclude_globs = ["crates/glasschain-core/src/proofs.rs"]
