# The audit job denies all warnings. One transitive exception remains in the
# current workspace graph:
# - libp2p's if-watch 3.2.2 caps netlink-packet-core at 0.8.x, which pulls
#   unmaintained paste; netlink-packet-core 0.9.0 is paste-free.
# Revisit every exception when an upstream dependency offers a compatible fix.
[output]
# Keep the audit strict: informational, unsound, and yanked findings fail CI.
quiet = false
deny = ["warnings"]

[yanked]
# Keep yanked-crate checks enabled; --deny warnings makes them fail CI.
enabled = true
update_index = true

[advisories]
ignore = [
    "RUSTSEC-2024-0436",
]
