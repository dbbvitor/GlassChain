# The audit job denies all warnings. These are known transitive or legacy
# dependencies with no compatible migration in the current workspace graph:
# - libp2p 0.56.0 -> libp2p-mdns 0.48.0 pins hickory-proto 0.25.2;
# - sled, criterion, madsim, and rustls-pemfile retain unmaintained crates;
# - madsim is test-only, while the others are transitive or compatibility APIs.
# Revisit every exception when its upstream dependency offers a compatible fix.
[output]
# Keep the audit strict: informational, unsound, and yanked findings fail CI.
deny = ["warnings"]

[yanked]
# The CI command passes --no-yanked because the lockfile is checked separately
# by Cargo; yanked crates should not make this audit nondeterministic.
enabled = false

[advisories]
ignore = [
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0134",
]
