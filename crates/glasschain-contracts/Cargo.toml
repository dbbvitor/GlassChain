[package]
name = "glasschain-contracts"
version = "0.1.0"
edition = "2021"
description = "Smart contracts engine for GlassChain – enables automated supply-chain purchases"
license = "Apache-2.0"
repository = "https://github.com/dbbvitor/GlassChain"
readme = "../../README.md"
keywords = ["blockchain", "supply-chain", "distributed-ledger"]
categories = ["network-programming", "asynchronous", "cryptography"]

[dependencies]
glasschain-core = { path = "../glasschain-core" }
serde   = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "2.0"
log        = "0.4"
base64     = "0.23"
# test_wasm fixtures compile WAT at runtime; other crates' tests consume them.
wat        = "1.256"

[dev-dependencies]
env_logger = "0.11"
glasschain-vm = { path = "../glasschain-vm" }


[lints]
workspace = true
