[package]
name = "glasschain-contracts"
version = "0.1.0"
edition = "2021"
description = "Smart contracts engine for GlassChain – enables automated supply-chain purchases"

[dependencies]
glasschain-core = { path = "../glasschain-core" }
glasschain-vm   = { path = "../glasschain-vm" }
wat     = "1.248"
serde   = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "2.0"
log        = "0.4"
base64     = "0.22"

[dev-dependencies]
env_logger = "0.11"
base64     = "0.22"
criterion  = { version = "0.5", features = ["html_reports"] }
glasschain-vm = { path = "../glasschain-vm" }

[[bench]]
name = "watcher_throughput"
harness = false

[lints]
workspace = true
