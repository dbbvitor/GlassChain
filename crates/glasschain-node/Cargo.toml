[package]
name = "glasschain-node"
version = "0.1.0"
edition = "2021"
description = "GlassChain node binary – run a full supply-chain ledger node"
license = "Apache-2.0"
repository = "https://github.com/dbbvitor/GlassChain"
readme = "../../README.md"
keywords = ["blockchain", "supply-chain", "distributed-ledger"]
categories = ["network-programming", "asynchronous", "cryptography"]

[[bin]]
name = "glasschain-node"
path = "src/main.rs"

[dependencies]
glasschain-core     = { path = "../glasschain-core" }
glasschain-network  = { path = "../glasschain-network" }
glasschain-identity = { path = "../glasschain-identity" }
glasschain-storage  = { path = "../glasschain-storage" }
glasschain-vm       = { path = "../glasschain-vm" }
glasschain-rpc      = { path = "../glasschain-rpc" }
tokio      = { version = "1.53", features = ["full"] }
log        = "0.4"
env_logger = "0.11"

[lints]
workspace = true
