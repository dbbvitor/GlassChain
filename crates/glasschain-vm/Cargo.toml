[package]
name = "glasschain-vm"
version = "0.1.0"
edition = "2021"
description = "WASM execution runtime and gas metering for GlassChain smart contracts (Phase 4)"
license = "Apache-2.0"
repository = "https://github.com/dbbvitor/GlassChain"
readme = "../../README.md"
keywords = ["blockchain", "supply-chain", "distributed-ledger"]
categories = ["network-programming", "asynchronous", "cryptography"]

[dependencies]
glasschain-core = { path = "../glasschain-core" }
# Only core modules, fuel, and WAT parsing are used; avoid unused Wasmtime
# component, cache, profiling, and other default feature dependency trees.
wasmtime = {
    version = "47.0.3",
    default-features = false,
    features = ["cranelift", "runtime", "wat"],
}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"

[dev-dependencies]
wat = "1.256"
criterion = "0.8"

[[bench]]
name = "vm_throughput"
harness = false

[lints]
workspace = true
