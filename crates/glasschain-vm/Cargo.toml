[package]
name = "glasschain-vm"
version = "0.1.0"
edition = "2021"
description = "WASM execution runtime and gas metering for GlassChain smart contracts (Phase 4)"

[dependencies]
glasschain-core = { path = "../glasschain-core" }
wasmtime = "44.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"

[dev-dependencies]
wat = "1.247"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vm_throughput"
harness = false

[lints]
workspace = true
