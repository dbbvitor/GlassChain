[package]
name = "glasschain-identity"
version = "0.1.0"
edition = "2021"
description = "Decentralized identity and X.509 MSP for GlassChain (Phase 2)"
license = "Apache-2.0"
repository = "https://github.com/dbbvitor/GlassChain"
readme = "../../README.md"
keywords = ["blockchain", "supply-chain", "distributed-ledger"]
categories = ["network-programming", "asynchronous", "cryptography"]

[dependencies]
glasschain-core = { path = "../glasschain-core" }
ed25519-dalek = { version = "2.2", features = ["rand_core", "pkcs8"] }
rcgen = { version = "0.14", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hex = "0.4"
log = "0.4"
x509-cert = "0.3"
rustls-pki-types = "1.0"
# lib name is `webpki`; `ring` matches the provider glasschain-network already
# selects for rustls, so both crates share one crypto backend.
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }

[dev-dependencies]

[lints]
workspace = true
