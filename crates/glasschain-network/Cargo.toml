[package]
name = "glasschain-network"
version = "0.1.0"
edition = "2021"
description = "P2P network protocol for federated GlassChain transactions"
license = "Apache-2.0"
repository = "https://github.com/dbbvitor/GlassChain"
readme = "../../README.md"
keywords = ["blockchain", "supply-chain", "distributed-ledger"]
categories = ["network-programming", "asynchronous", "cryptography"]

[dependencies]
glasschain-core       = { path = "../glasschain-core" }
glasschain-contracts  = { path = "../glasschain-contracts" }
glasschain-indexer    = { path = "../glasschain-indexer" }
glasschain-identity   = { path = "../glasschain-identity" }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
tokio        = { version = "1.52", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }
thiserror    = "2.0"
log          = "0.4"
base64       = "0.23"
tokio-rustls = "0.26"
rustls       = { version = "0.23", features = ["ring"] }
rcgen        = "0.14"
libp2p       = { version = "0.56.0", features = [
    "gossipsub",
    "kad",
    "tcp",
    "noise",
    "yamux",
    "identify",
    "mdns",
    "macros",
    "tokio",
] }
futures      = "0.3"

[dev-dependencies]
env_logger   = "0.11"
x509-parser  = "0.18"
wat          = "1.256"
tempfile     = "3"
glasschain-vm = { path = "../glasschain-vm" }
glasschain-storage = { path = "../glasschain-storage" }
# default-features = false drops madsim's `rpc` feature, whose optional
# bincode 1.x dependency is unmaintained (RUSTSEC-2025-0141). Only `macros`
# is used by tests/madsim_chaos.rs.
madsim     = { version = "0.2", default-features = false, features = [
    "macros",
] }

[features]
default       = []
insecure-tls  = []

[lints]
workspace = true
