[package]
name = "glasschain-network"
version = "0.1.0"
edition = "2021"
description = "P2P network protocol for federated GlassChain transactions"
license = "Apache-2.0"
repository = "https://github.com/dbbvitor/GlassChain"
readme = "../../README.md"
keywords = ["blockchain", "supply-chain", "distributed-ledger"]
categories = ["network-programming", "asynchronous", "cryptography"]

[dependencies]
glasschain-core       = { version = "0.1.0", path = "../glasschain-core" }
glasschain-contracts  = { version = "0.1.0", path = "../glasschain-contracts" }
glasschain-workflows  = { version = "0.1.0", path = "../glasschain-workflows" }
glasschain-indexer    = { version = "0.1.0", path = "../glasschain-indexer" }
glasschain-identity   = { version = "0.1.0", path = "../glasschain-identity" }
glasschain-storage    = { version = "0.1.0", path = "../glasschain-storage" }
# BLS signing for the `bft`-gated historical QC verifier (#97); the dev-dep
# entry below covers the test scenarios with the same pin.
bls-signatures = { version = "0.15", default-features = false, features = ["blst"], optional = true }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
tokio        = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }
thiserror    = "2.0"
log          = "0.4"
base64       = "0.23"
hex          = "0.4"
tokio-rustls = "0.26"
rustls       = { version = "0.23", features = ["ring"] }
rcgen        = "0.14"
libp2p       = { version = "0.57.0", features = [
    "gossipsub",
    "kad",
    "tcp",
    "noise",
    "yamux",
    "identify",
    "mdns",
    "macros",
    "tokio",
] }
futures      = "0.3"
# Deterministic simulation transport (decision #154). Optional so the default
# build keeps tokio's real sockets; the `turmoil-sim` feature swaps the node's
# TCP seam to turmoil's simulated sockets inside `turmoil::Sim` runs only.
turmoil      = { version = "0.7.2", optional = true }

[dev-dependencies]
env_logger   = "0.11"
x509-parser  = "0.18"
wat          = "1.258"
tempfile     = "3"
# BLS keys for the bft_finality scenario (cfg-gated with the bft feature).
bls-signatures = { version = "0.15", default-features = false, features = ["blst"] }
glasschain-vm = { version = "0.1.0", path = "../glasschain-vm" }
glasschain-storage = { version = "0.1.0", path = "../glasschain-storage" }
criterion = "0.8"

[features]
default       = []
insecure-tls  = []

# Negotiated post-quantum hybrid key exchange (zero-trust ZT-3, post-quantum
# plan): selects the aws-lc-rs provider for the peer transport and offers the
# X25519MLKEM768 hybrid first, classical X25519 second. Certificate
# verification and TOFU behaviour are unchanged. aws-lc-rs is already in the
# dependency graph (rustls default features); this feature only flips runtime
# selection. The #85 backend review remains the audit/licence decision gate.
pq-tls        = ["rustls/aws_lc_rs"]
# Tendermint-class BFT behind the consensus seam (ticket #42), default-off.
# Enables `glasschain-core/bft` so the node can attest blocks with a real
# quorum certificate instead of dev/test Proof-of-Work.
bft = ["glasschain-core/bft", "dep:bls-signatures"]
# Deterministic chaos runs (decision #154): routes the node's TCP seam through
# turmoil's simulated sockets while inside a `turmoil::Sim`, leaving real tokio
# sockets untouched elsewhere. Test-only in practice.
turmoil-sim = ["dep:turmoil"]

[[bench]]
name = "wire_codec"
harness = false
required-features = ["bft"]

[lints]
workspace = true
