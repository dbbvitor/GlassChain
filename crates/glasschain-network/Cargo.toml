[package]
name = "glasschain-network"
version = "0.1.0"
edition = "2021"
description = "P2P network protocol for federated GlassChain transactions"

[dependencies]
glasschain-core       = { path = "../glasschain-core" }
glasschain-contracts  = { path = "../glasschain-contracts" }
glasschain-indexer    = { path = "../glasschain-indexer" }
glasschain-identity   = { path = "../glasschain-identity" }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
tokio        = { version = "1.52", features = ["full"] }
thiserror    = "2.0"
log          = "0.4"
tokio-rustls = "0.26"
rustls       = { version = "0.23", features = ["ring"] }
rcgen        = "0.14"
libp2p       = { version = "0.56", features = [
    "gossipsub",
    "kad",
    "tcp",
    "noise",
    "yamux",
    "identify",
    "mdns",
    "macros",
    "tokio",
] }
futures      = "0.3"

[dev-dependencies]
env_logger = "0.11"
madsim     = { version = "0.2", features = ["macros"] }

[features]
default       = []
insecure-tls  = []

[lints]
workspace = true
