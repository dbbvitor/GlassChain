[package]
name = "glasschain-rpc"
version = "0.1.0"
edition = "2021"
description = "gRPC service layer for GlassChain (Phase 1 – Tonic + Prost)"

[dependencies]
glasschain-core = { path = "../glasschain-core" }
glasschain-network = { path = "../glasschain-network" }
glasschain-identity = { path = "../glasschain-identity" }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
