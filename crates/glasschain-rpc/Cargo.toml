[package]
name = "glasschain-rpc"
version = "0.1.0"
edition = "2021"
description = "gRPC service layer for GlassChain (Phase 1 – Tonic + Prost)"

[dependencies]
glasschain-core = { path = "../glasschain-core" }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
