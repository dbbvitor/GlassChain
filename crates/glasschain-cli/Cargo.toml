[package]
name = "glasschain-cli"
version = "0.1.0"
edition = "2021"
description = "GlassChain CLI — identity-gen, contract-deploy, ledger-inspect"
license = "Apache-2.0"
repository = "https://github.com/dbbvitor/GlassChain"
readme = "../../README.md"
keywords = ["blockchain", "supply-chain", "distributed-ledger"]
categories = ["network-programming", "asynchronous", "cryptography"]

[[bin]]
name = "glasschain"
path = "src/main.rs"

[dependencies]
glasschain-core    = { path = "../glasschain-core" }
glasschain-identity = { path = "../glasschain-identity" }
glasschain-rpc      = { path = "../glasschain-rpc" }
glasschain-storage = { path = "../glasschain-storage" }
glasschain-sdk     = { path = "../glasschain-sdk" }
base64             = "0.23"
ed25519-dalek      = { version = "3.0", features = ["rand_core"] }
tokio              = { version = "1", features = ["rt"] }
tonic              = { version = "0.14.6", features = ["transport"] }
hex                = "0.4"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
clap               = { version = "4.6", features = ["derive"] }
anyhow             = "1"
log                = "0.4"
env_logger         = "0.11"

[dev-dependencies]
glasschain-network = { path = "../glasschain-network" }
tokio = { version = "1", features = ["rt", "macros"] }
tonic = { version = "0.14.6", features = ["transport"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
serde_json = "1.0"
hex = "0.4"

[lints]
workspace = true
