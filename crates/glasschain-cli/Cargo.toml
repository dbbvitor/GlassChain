[package]
name = "glasschain-cli"
version = "0.1.0"
edition = "2021"
description = "GlassChain CLI — identity-gen, contract-deploy, ledger-inspect"

[[bin]]
name = "glasschain"
path = "src/main.rs"

[dependencies]
glasschain-core    = { path = "../glasschain-core" }
glasschain-identity = { path = "../glasschain-identity" }
glasschain-sdk     = { path = "../glasschain-sdk" }
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
clap               = { version = "4.5", features = ["derive"] }
anyhow             = "1"
log                = "0.4"
env_logger         = "0.11"

[lints]
workspace = true
