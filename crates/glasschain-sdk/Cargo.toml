[package]
name = "glasschain-sdk"
version = "0.1.0"
edition = "2021"
description = "High-level Rust SDK for GlassChain — submit transactions and query the ledger in < 10 lines"
license = "Apache-2.0"
repository = "https://github.com/dbbvitor/GlassChain"
readme = "../../README.md"
keywords = ["blockchain", "supply-chain", "distributed-ledger"]
categories = ["network-programming", "asynchronous", "cryptography"]

[dependencies]
glasschain-core = { path = "../glasschain-core" }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"


[lints]
workspace = true
