[package]
name = "glasschain-core"
version = "0.1.0"
edition = "2021"
description = "Core blockchain primitives for GlassChain distributed ledger"
license = "Apache-2.0"
repository = "https://github.com/dbbvitor/GlassChain"
readme = "../../README.md"
keywords = ["blockchain", "supply-chain", "distributed-ledger"]
categories = ["network-programming", "asynchronous", "cryptography"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64      = "0.23"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1.26", features = ["v4"] }
thiserror = "2.0"
log = "0.4"
# BLS12-381 aggregate signatures for quorum certificates (ADR-014). The
# `blst` C backend is selected per ADR-015: the pure-Rust `pairing` backend
# cannot pass the 300-validator finality gate (first vote 34.8 s).
bls-signatures = { version = "0.15", default-features = false, features = [
    "blst",
], optional = true }
# Same-message multisig verify (ADR-014): `bls-signatures` ships only the
# distinct-message aggregate verify, so the pairings run over `blstrs`
# directly (ADR-015). `group`/`pairing` are blstrs' version-matched algebraic
# trait crates.
blstrs = { version = "0.7", default-features = false, optional = true }
group = { version = "0.13", default-features = false, optional = true }
pairing = { version = "0.23", default-features = false, optional = true }

[features]
default = []
# Tendermint-class BFT consensus behind the seam (ticket #42). Default-off:
# Proof-of-Work remains the dev/test driver. Pulls ed25519-dalek for real
# validator attestations.
bft = ["dep:bls-signatures", "dep:blstrs", "dep:group", "dep:pairing"]

[dev-dependencies]
env_logger = "0.11"
criterion = "0.8"
# The bft_verify bench measures the superseded pure-Rust pairing path against
# the shipped blst paths (ADR-015 evidence), so it needs both backends.
bls12_381 = { version = "0.8", features = ["experimental"] }
bls-signatures = { version = "0.15", default-features = false, features = ["blst"] }
blstrs = { version = "0.7", default-features = false }
group = { version = "0.13", default-features = false }
pairing = { version = "0.23", default-features = false }

[[bench]]
name = "ledger_admission"
harness = false

[[bench]]
name = "bft_verify"
harness = false

[lints]
workspace = true
