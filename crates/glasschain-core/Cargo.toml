[package]
name = "glasschain-core"
version = "0.1.0"
edition = "2021"
description = "Core blockchain primitives for GlassChain distributed ledger"
license = "Apache-2.0"
repository = "https://github.com/dbbvitor/GlassChain"
readme = "../../README.md"
keywords = ["blockchain", "supply-chain", "distributed-ledger"]
categories = ["network-programming", "asynchronous", "cryptography"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64      = "0.23"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1.26", features = ["v4"] }
thiserror = "2.0"
log = "0.4"
# BLS12-381 aggregate signatures for quorum certificates (ADR-014). Pure-Rust
# `pairing` backend; the blst C backend stays out of the workspace.
bls-signatures = { version = "0.15", default-features = false, features = [
    "pairing",
], optional = true }
# Pairing check for the same-message multisig verify (ADR-014): the pure-Rust
# bls-signatures backend only ships the distinct-message aggregate verify.
bls12_381 = { version = "0.8", optional = true }

[features]
default = []
# Tendermint-class BFT consensus behind the seam (ticket #42). Default-off:
# Proof-of-Work remains the dev/test driver. Pulls ed25519-dalek for real
# validator attestations.
bft = ["dep:bls-signatures", "dep:bls12_381"]

[dev-dependencies]
env_logger = "0.11"

[lints]
workspace = true
