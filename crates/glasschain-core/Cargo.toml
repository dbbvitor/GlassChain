[package]
name = "glasschain-core"
version = "0.1.0"
edition = "2021"
description = "Core blockchain primitives for GlassChain distributed ledger"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.23", features = ["v4"] }
thiserror = "2.0"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"

[lints]
workspace = true
